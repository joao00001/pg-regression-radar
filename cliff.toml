# git-cliff configuration — generates release notes / CHANGELOG.md entries
# straight from `git log`, parsed as Conventional Commits (see
# CONTRIBUTING.md's "Commit messages: Conventional Commits" section for the
# type/scope tables this file's `commit_parsers` below mirror).
#
# Why git-cliff over release-please or semantic-release: this repo already
# has a manual, human-decided tagging flow (`git tag vX.Y.Z && git push
# origin vX.Y.Z` triggers .github/workflows/release.yml) and squash-merges
# every PR into one Conventional Commits-formatted commit on `main` (see
# CONTRIBUTING.md). git-cliff is a single statically-linked Rust binary that
# reads that `git log` directly with no Node/Python toolchain, no bot-owned
# "Release PR" that has to be merged before a tag can be cut, and no change
# to how versions get decided — it slots underneath the existing flow
# instead of replacing it. release-please (and semantic-release) are built
# around *owning* the version-bump decision themselves (a standing "please
# release" PR that bumps version files and picks the next semver from commit
# types); that's a heavier, more opinionated model this project's owner
# didn't ask for — the ask here was "generate notes from commits I already
# wrote", not "let a bot decide when and what to release". git-cliff is also
# used purely as a CLI invoked from release.yml (see the "Generate release
# notes" step there), so it needs no GitHub App install, no extra
# permissions beyond what that workflow already has, and no bot commits
# back to the repository.
#
# Used two ways in this repo:
#   1. .github/workflows/release.yml calls `git-cliff --latest --strip
#      header` on every `v*` tag push to build that one release's GitHub
#      Release body (commits between the previous tag and the new one).
#   2. Run by hand (`git-cliff v0.1.0..HEAD`) to regenerate the full
#      CHANGELOG.md — see that file's own header for why the checked-in copy
#      is hand-curated/reorganized rather than a raw tool dump.

[changelog]
header = """
# Changelog

All notable changes to this project are documented in this file.

Generated with [git-cliff](https://git-cliff.org/) from Conventional Commits
on `git log`; see `cliff.toml` for how commits are categorized.
"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
            {% if commit.breaking %}[**BREAKING**] {% endif %}\
            {{ commit.message | upper_first }} ({{ commit.id | truncate(length=7, end="") }})
    {% endfor %}
{% endfor %}
"""
trim = true
# A tag/release with zero matched commits still gets its heading — avoids a
# silently-empty release body if a future tag is cut with only commits this
# config's parsers don't recognize.
render_always = true
footer = ""

[git]
conventional_commits = true
# Keep commits that don't parse as Conventional Commits instead of dropping
# them — this repo's history predates strict enforcement (pr-title.yml) and
# has a handful of merge commits / one typo'd type ("fiz(doc)") that are
# still real, worth-reading changes. They land in the catch-all "Other"
# group below rather than vanishing, which matters for the one-time full
# v0.1.0..HEAD regeneration even though it should rarely trigger for new
# tags going forward now that every PR title is enforced.
filter_unconventional = false
require_conventional = false
split_commits = false
protect_breaking_commits = false

commit_preprocessors = [
    # Normalize the one historical typo'd commit type in this repo's history
    # (b749609 "fiz(doc): fix typo") so it parses as a normal Conventional
    # Commit; simpler than special-casing it in commit_parsers below.
    { pattern = '^fiz\(', replace = "fix(" },
]

# Mirrors CONTRIBUTING.md's type table exactly, plus a catch-all so nothing
# from a still-unconventional commit is silently excluded. Order matters:
# first match wins.
commit_parsers = [
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Fixes" },
    { message = "^perf", group = "Performance" },
    { message = "^docs", group = "Documentation" },
    { message = "^refactor", group = "Refactoring" },
    { message = "^test", group = "Testing" },
    { message = "^ci", group = "CI/Infrastructure" },
    { message = "^chore\\(deps\\)", group = "Dependencies" },
    { message = "^chore", group = "Chores" },
    { message = "^revert", group = "Reverts" },
    { message = ".*", group = "Other" },
]
filter_commits = false
use_branch_tags = false
topo_order = false
topo_order_commits = true
sort_commits = "oldest"
recurse_submodules = false

# Only real release tags (this repo's convention: bare "vX.Y.Z", e.g.
# v0.1.0 — see release.yml's top comment) are treated as version
# boundaries; no pre-release/rc suffixes are in use today, but the pattern
# is intentionally strict rather than a bare "v*" so a stray annotated tag
# of some other shape can't silently become a changelog heading.
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
