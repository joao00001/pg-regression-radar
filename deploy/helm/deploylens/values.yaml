# Default values for pg-regression-radar.
# Override in your own values.yaml or via --set.

# mode selects which binary the chart deploys:
#   "operator" (default) — cmd/operator/main.go: a single CLI-flag-configured
#     process watching exactly one Postgres DSN, no Kubernetes API access,
#     no CRDs required. Simplest to run; no HA.
#   "manager" — cmd/manager/main.go: a controller-runtime manager that
#     reconciles PostgresWatch/DeploySource/PerformanceRegression CRDs,
#     supports many watches at once, and runs multiple replicas with
#     leader election for HA (only the elected leader does work; a standby
#     takes over automatically on failure via a coordination.k8s.io Lease).
#     Recommended for production. See README.md, "Two ways to run
#     pg-regression-radar", for the full comparison.
mode: operator

replicaCount: 1

image:
  repository: ghcr.io/joao00001/pg-regression-radar/operator
  pullPolicy: IfNotPresent
  tag: ""  # defaults to Chart.appVersion

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

# Defaults here match how every image this chart deploys already runs
# in practice: all five binaries (operator/manager/collector/ingester/cli)
# build on gcr.io/distroless/static-debian12:nonroot (see the Dockerfile),
# which already sets USER nonroot:nonroot (UID/GID 65532) and has no shell,
# package manager, or writable filesystem tooling at all. None of the four
# server binaries write to the local filesystem (no log files, no on-disk
# cache/temp files -- logging goes to stdout via slog), so
# readOnlyRootFilesystem causes no loss of function; it just makes the
# already-true "this container doesn't write to disk" property enforced by
# the kubelet instead of merely true by accident. Override either value
# (e.g. back to {}) only for an environment with an admission policy that
# conflicts with these fields, or a fork that adds local file I/O.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Postgres connection string for the collector.
# Override this with a secret reference in production.
postgres:
  dsn: ""
  clusterName: "default"
  namespace: "default"
  # Used by mode: operator (cmd/operator's --scrape-interval flag, a Go
  # duration string).
  scrapeInterval: "60s"
  # Used by mode: manager's default PostgresWatch CR (scrapeIntervalSeconds
  # is an int on the CRD, so it's a separate value from scrapeInterval
  # above rather than something the chart parses out of a duration string).
  scrapeIntervalSeconds: 60
  # How long (minutes) the collector retains in-memory pg_stat_statements
  # samples before pruning them. Default is 3x the default 30-minute
  # analysis window's full before+after span (2*30=60 min); keep this well
  # above 2 * analysis.windowMinutes if you raise that value.
  retentionMinutes: 180

# State persistence backend (query samples + deploy events). See the
# "Persistence" section of the README for schema/trade-off details.
# backend: "memory" (default, unchanged behaviour, no extra Postgres writes)
#          "postgres" (persists to Postgres; survives restarts, shareable across replicas)
# dsn: Postgres DSN for the state backend. Leave empty to reuse postgres.dsn
#      above (store state in the same monitored cluster). Set it to point
#      state at a separate Postgres instance instead.
state:
  backend: "memory"
  dsn: ""
  retention: "168h"
  pruneInterval: "15m"

# Correlation engine settings. Used by both modes: operator passes these as
# CLI flags; manager's default PostgresWatch CR (see manager.createDefaultWatch)
# sets the equivalent spec fields.
analysis:
  windowMinutes: 30
  minExecutions: 10
  latencyThreshold: "0.20"
  pValueThreshold: "0.05"

# Deploy-independent ("periodic") regression detection: also analyses every
# tracked query on its own rolling schedule, instead of only around
# DeployEvents. See docs/periodic-detection.md and docs/adr/0001. Used by
# both modes: operator passes these as CLI flags (--periodic-detection,
# --periodic-window-minutes, --periodic-interval-minutes); manager's
# default PostgresWatch CR (see manager.createDefaultWatch) sets the
# equivalent spec.periodicDetection fields. Off by default; deploy-triggered
# detection above is unaffected either way.
periodicDetection:
  enabled: false
  windowMinutes: 60
  intervalMinutes: 15

# Webhook ingester settings.
ingester:
  sourceType: "argocd"
  # webhookSecret is the shared secret for authenticating incoming webhook
  # requests. When non-empty, every POST to /webhook must include this value
  # in the X-Webhook-Token header; requests without it are rejected with 401.
  # Strongly recommended for any deployment reachable from outside the cluster.
  webhookSecret: ""

# Alerting settings. See docs/alerting.md for the full list of supported
# formats and the custom template's available fields.
alerting:
  # Deprecated: use format/url instead (format left empty, or set to
  # "slack", is equivalent). Ignored whenever format is set.
  slackWebhookUrl: ""
  # format selects the notification payload layout: "" (same as "slack"),
  # "teams", "pagerduty", or "custom".
  format: ""
  # url is the webhook endpoint for the slack, teams, and custom formats.
  # Ignored for pagerduty. Falls back to slackWebhookUrl when empty.
  url: ""
  # allowedDestinations enables a stricter, opt-in allowlist for alert
  # destinations in both operator and manager mode: comma-separated exact
  # hostnames, IPs, or CIDRs. Leave empty to keep the default best-effort
  # SSRF mitigation only.
  allowedDestinations: ""
  # pagerDutyRoutingKey is the PagerDuty Events API v2 routing key, required
  # (and only used) when format is "pagerduty".
  pagerDutyRoutingKey: ""
  # customTemplate is Go text/template source, required (and only used)
  # when format is "custom".
  customTemplate: ""

service:
  type: ClusterIP
  webhookPort: 8080
  metricsPort: 9090

resources:
  limits:
    cpu: 200m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi

# Optional NetworkPolicy resources (off by default). When enabled, the chart
# renders mode-specific default-deny + explicit allow rules for ingress and
# egress.
networkPolicy:
  enabled: false
  # Optional source CIDR allowed to reach webhook/metrics ports. Leave empty to
  # allow from any source.
  ingressCIDR: ""
  egress:
    # CIDRs allowed for PostgreSQL connections (typically your DB service CIDR
    # or a narrow pod/network range).
    postgresCIDRs: []
    postgresPorts:
      - 5432
    # CIDRs for Kubernetes API servers (hub and/or remote clusters) reachable
    # by manager mode.
    apiServerCIDRs: []
    apiServerPorts:
      - 443
    # CIDRs for outbound alert relays or webhook receivers.
    alertRelayCIDRs: []
    alertRelayPorts:
      - 443
    # DNS access (CoreDNS / kube-dns) for service discovery.
    dns:
      enabled: true
      namespace: kube-system
      port: 53

# Optional namespace-level ResourceQuota rendered by this chart.
resourceQuota:
  enabled: false
  hard:
    requests.cpu: "2"
    requests.memory: "1Gi"
    limits.cpu: "4"
    limits.memory: "2Gi"
    pods: "20"

# Optional namespace-level LimitRange rendered by this chart.
limitRange:
  enabled: false
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi

# Optional PodSecurityPolicy support for legacy clusters only (policy/v1beta1).
podSecurityPolicy:
  enabled: false

# manager-specific settings; only relevant when mode: manager.
manager:
  replicaCount: 2

  image:
    repository: ghcr.io/joao00001/pg-regression-radar/manager
    pullPolicy: IfNotPresent
    tag: ""  # defaults to Chart.appVersion

  # Leader election is what makes replicaCount > 1 safe: exactly one
  # replica reconciles CRs and serves the webhook/pg-metrics listeners at
  # any time. Disable only for single-replica local development, where the
  # coordination.k8s.io Lease round-trip just adds startup latency.
  leaderElection:
    enabled: true

  ports:
    webhook: 8080     # deploy-event webhooks, one route per DeploySource CR
    pgMetrics: 9090    # aggregated pg_stat_statements-derived metrics
    ctrlMetrics: 8443  # controller-runtime's own reconcile/workqueue metrics
    healthProbe: 8081  # /healthz and /readyz

  # When true, the chart also renders one PostgresWatch and one
  # DeploySource CR from the postgres/analysis/ingester/alerting values
  # above, so switching `mode` from "operator" to "manager" reproduces the
  # same single-cluster behaviour without hand-writing CRs first. Turn
  # this off once you manage PostgresWatch/DeploySource CRs directly
  # (e.g. to watch more than one Postgres cluster from one manager
  # Deployment).
  createDefaultWatch: true

  # Auto-abort (see docs/auto-abort.md): automatically aborting an Argo
  # Rollouts canary on a high-confidence detected regression, instead of
  # only alerting. Off by default at two independent levels: the RBAC to
  # even reach Rollout objects (rbacEnabled, below) and the behaviour
  # itself (PostgresWatch.spec.autoAbort.enabled, per watch, unset by this
  # chart). Set rbacEnabled: true here only if at least one PostgresWatch
  # you manage will actually set spec.autoAbort.enabled — there is no
  # reason to grant this RBAC otherwise.
  autoAbort:
    rbacEnabled: false

  resources:
    limits:
      cpu: 200m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi

nodeSelector: {}
tolerations: []
affinity: {}
