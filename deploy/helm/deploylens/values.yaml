# Default values for pg-regression-radar.
# Override in your own values.yaml or via --set.

replicaCount: 1

image:
  repository: ghcr.io/joao00001/pg-regression-radar/operator
  pullPolicy: IfNotPresent
  tag: ""  # defaults to Chart.appVersion

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podSecurityContext: {}
securityContext: {}

# Postgres connection string for the collector.
# Override this with a secret reference in production.
postgres:
  dsn: ""
  clusterName: "default"
  namespace: "default"
  scrapeInterval: "60s"
  # How long (minutes) the collector retains in-memory pg_stat_statements
  # samples before pruning them. Default is 3x the default 30-minute
  # analysis window's full before+after span (2*30=60 min); keep this well
  # above 2 * analysis.windowMinutes if you raise that value.
  retentionMinutes: 180

# Correlation engine settings.
analysis:
  windowMinutes: 30
  minExecutions: 10
  latencyThreshold: "0.20"

# Webhook ingester settings.
ingester:
  sourceType: "argocd"

# Alerting settings.
alerting:
  slackWebhookUrl: ""

service:
  type: ClusterIP
  webhookPort: 8080
  metricsPort: 9090

resources:
  limits:
    cpu: 200m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi

nodeSelector: {}
tolerations: []
affinity: {}
