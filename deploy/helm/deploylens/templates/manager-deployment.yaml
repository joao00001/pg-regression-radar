{{- if eq .Values.mode "manager" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "deploylens.fullname" . }}-manager
  labels:
    {{- include "deploylens.labels" . | nindent 4 }}
    app.kubernetes.io/component: manager
spec:
  replicas: {{ .Values.manager.replicaCount }}
  selector:
    matchLabels:
      {{- include "deploylens.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: manager
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "deploylens.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: manager
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "deploylens.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: manager
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.manager.image.repository }}:{{ .Values.manager.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.manager.image.pullPolicy }}
          args:
            - --leader-elect={{ .Values.manager.leaderElection.enabled }}
            - --leader-election-namespace={{ .Release.Namespace }}
            - --webhook-bind-address=:{{ .Values.manager.ports.webhook }}
            - --pg-metrics-bind-address=:{{ .Values.manager.ports.pgMetrics }}
            - --metrics-bind-address=:{{ .Values.manager.ports.ctrlMetrics }}
            - --health-probe-bind-address=:{{ .Values.manager.ports.healthProbe }}
          ports:
            - name: webhook
              containerPort: {{ .Values.manager.ports.webhook }}
              protocol: TCP
            - name: pg-metrics
              containerPort: {{ .Values.manager.ports.pgMetrics }}
              protocol: TCP
            - name: ctrl-metrics
              containerPort: {{ .Values.manager.ports.ctrlMetrics }}
              protocol: TCP
            - name: probes
              containerPort: {{ .Values.manager.ports.healthProbe }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: probes
          readinessProbe:
            httpGet:
              path: /readyz
              port: probes
          resources:
            {{- toYaml .Values.manager.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
