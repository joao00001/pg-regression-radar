{{- if eq .Values.mode "manager" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "deploylens.fullname" . }}-manager
  labels:
    {{- include "deploylens.labels" . | nindent 4 }}
    app.kubernetes.io/component: manager
spec:
  replicas: {{ .Values.manager.replicaCount }}
  selector:
    matchLabels:
      {{- include "deploylens.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: manager
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "deploylens.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: manager
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "deploylens.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: manager
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.manager.image.repository }}:{{ .Values.manager.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.manager.image.pullPolicy }}
          args:
            - --leader-elect={{ .Values.manager.leaderElection.enabled }}
            - --leader-election-namespace={{ .Release.Namespace }}
            - --webhook-bind-address=:{{ .Values.manager.ports.webhook }}
            - --pg-metrics-bind-address=:{{ .Values.manager.ports.pgMetrics }}
            - --metrics-bind-address=:{{ .Values.manager.ports.ctrlMetrics }}
            - --health-probe-bind-address=:{{ .Values.manager.ports.healthProbe }}
            {{- if .Values.manager.logLevel }}
            - {{ printf "--log-level=%s" .Values.manager.logLevel | quote }}
            {{- end }}
            {{- if .Values.manager.logFormat }}
            - {{ printf "--log-format=%s" .Values.manager.logFormat | quote }}
            {{- end }}
            {{- if .Values.manager.clusterHealthCheckInterval }}
            - {{ printf "--cluster-health-check-interval=%s" .Values.manager.clusterHealthCheckInterval | quote }}
            {{- end }}
            {{- if .Values.alerting.allowedDestinations }}
            - {{ printf "--alerting-allowed-destinations=%s" .Values.alerting.allowedDestinations | quote }}
            {{- end }}
            {{- if .Values.alerting.destinationPolicy }}
            - {{ printf "--alerting-destination-policy=%s" .Values.alerting.destinationPolicy | quote }}
            {{- end }}
            - {{ printf "--security-profile=%s" .Values.securityProfile | quote }}
            {{- with .Values.manager.observe.history }}
            - {{ printf "--observe-history=%s" .store | quote }}
            - {{ printf "--observe-history-retention=%s" .retention | quote }}
            - {{ printf "--observe-history-max-deploys=%d" (int .maxDeploys) | quote }}
            {{- if eq .store "postgres" }}
            - --observe-history-dsn-file=/etc/pgrr/history/{{ .postgres.key }}
            {{- end }}
            {{- end }}
            {{- if .Values.alerting.destinationPolicyRelayUrl }}
            - --alerting-destination-policy-relay-url=$(ALERTING_DESTINATION_POLICY_RELAY_URL)
            {{- end }}
          {{- if .Values.alerting.destinationPolicyRelayUrl }}
          env:
            - name: ALERTING_DESTINATION_POLICY_RELAY_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "deploylens.fullname" . }}-secret
                  key: alertingDestinationPolicyRelayUrl
          {{- end }}
          ports:
            - name: webhook
              containerPort: {{ .Values.manager.ports.webhook }}
              protocol: TCP
            - name: pg-metrics
              containerPort: {{ .Values.manager.ports.pgMetrics }}
              protocol: TCP
            - name: ctrl-metrics
              containerPort: {{ .Values.manager.ports.ctrlMetrics }}
              protocol: TCP
            - name: probes
              containerPort: {{ .Values.manager.ports.healthProbe }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: probes
          readinessProbe:
            httpGet:
              path: /readyz
              port: probes
          {{- if eq .Values.manager.observe.history.store "postgres" }}
          volumeMounts:
            - name: observe-history-dsn
              mountPath: /etc/pgrr/history
              readOnly: true
          {{- end }}
          resources:
            {{- toYaml .Values.manager.resources | nindent 12 }}
      {{- if eq .Values.manager.observe.history.store "postgres" }}
      volumes:
        - name: observe-history-dsn
          secret:
            secretName: {{ required "manager.observe.history.postgres.existingSecret is required when manager.observe.history.store is postgres" .Values.manager.observe.history.postgres.existingSecret }}
            defaultMode: 0440
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
