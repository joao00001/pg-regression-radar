{{- if and .Values.podSecurityPolicy.enabled (.Capabilities.APIVersions.Has "policy/v1beta1/PodSecurityPolicy") }}
apiVersion: policy/v1beta1
kind: PodSecurityPolicy
metadata:
  name: {{ include "deploylens.fullname" . }}
  labels:
    {{- include "deploylens.labels" . | nindent 4 }}
spec:
  privileged: false
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  requiredDropCapabilities:
    - ALL
  runAsUser:
    rule: MustRunAsNonRoot
  seLinux:
    rule: RunAsAny
  fsGroup:
    rule: MustRunAs
    ranges:
      - min: 65532
        max: 65532
  supplementalGroups:
    rule: MustRunAs
    ranges:
      - min: 65532
        max: 65532
  volumes:
    - secret
    - downwardAPI
    - configMap
    - projected
{{- end }}
