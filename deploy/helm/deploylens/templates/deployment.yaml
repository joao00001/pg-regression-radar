{{- if eq .Values.mode "operator" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "deploylens.fullname" . }}
  labels:
    {{- include "deploylens.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "deploylens.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "deploylens.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "deploylens.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: operator
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --dsn=$(POSTGRES_DSN)
            - --cluster-name={{ .Values.postgres.clusterName }}
            - --namespace={{ .Values.postgres.namespace }}
            - --scrape-interval={{ .Values.postgres.scrapeInterval }}
            - --webhook-listen=:{{ .Values.service.webhookPort }}
            - --metrics-listen=:{{ .Values.service.metricsPort }}
            - --slack-url=$(SLACK_WEBHOOK_URL)
            {{- if .Values.alerting.format }}
            - --alert-format={{ .Values.alerting.format }}
            {{- end }}
            {{- if .Values.alerting.url }}
            - --alert-url=$(ALERT_URL)
            {{- end }}
            {{- if .Values.alerting.allowedDestinations }}
            - {{ printf "--alerting-allowed-destinations=%s" .Values.alerting.allowedDestinations | quote }}
            {{- end }}
            {{- if .Values.alerting.pagerDutyRoutingKey }}
            - --pagerduty-routing-key=$(PAGERDUTY_ROUTING_KEY)
            {{- end }}
            {{- if .Values.alerting.customTemplate }}
            - --alert-template=$(ALERT_TEMPLATE)
            {{- end }}
            - --source-type={{ .Values.ingester.sourceType }}
            {{- if .Values.ingester.webhookSecret }}
            - --webhook-secret=$(WEBHOOK_SECRET)
            {{- end }}
            - --window-minutes={{ .Values.analysis.windowMinutes }}
            - --min-executions={{ .Values.analysis.minExecutions }}
            - --latency-threshold={{ .Values.analysis.latencyThreshold }}
            - --retention-minutes={{ .Values.postgres.retentionMinutes }}
            - --state-backend={{ .Values.state.backend }}
            - --state-dsn=$(STATE_DSN)
            - --state-retention={{ .Values.state.retention }}
            - --state-prune-interval={{ .Values.state.pruneInterval }}
            {{- if .Values.periodicDetection.enabled }}
            - --periodic-detection
            - --periodic-window-minutes={{ .Values.periodicDetection.windowMinutes }}
            - --periodic-interval-minutes={{ .Values.periodicDetection.intervalMinutes }}
            {{- end }}
          env:
            - name: POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ include "deploylens.fullname" . }}-secret
                  key: dsn
            - name: SLACK_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "deploylens.fullname" . }}-secret
                  key: slackWebhookUrl
                  optional: true
            - name: ALERT_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "deploylens.fullname" . }}-secret
                  key: alertUrl
                  optional: true
            {{- if .Values.alerting.pagerDutyRoutingKey }}
            - name: PAGERDUTY_ROUTING_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "deploylens.fullname" . }}-secret
                  key: pagerDutyRoutingKey
            {{- end }}
            {{- if .Values.alerting.customTemplate }}
            - name: ALERT_TEMPLATE
              valueFrom:
                secretKeyRef:
                  name: {{ include "deploylens.fullname" . }}-secret
                  key: alertTemplate
            {{- end }}
            - name: STATE_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ include "deploylens.fullname" . }}-secret
                  key: stateDsn
                  optional: true
            {{- if .Values.ingester.webhookSecret }}
            - name: WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "deploylens.fullname" . }}-secret
                  key: webhookSecret
            {{- end }}
          ports:
            - name: webhook
              containerPort: {{ .Values.service.webhookPort }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.service.metricsPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: webhook
          readinessProbe:
            httpGet:
              path: /healthz
              port: webhook
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
