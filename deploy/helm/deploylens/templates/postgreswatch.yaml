{{- if and (eq .Values.mode "manager") .Values.manager.createDefaultWatch }}
apiVersion: radar.pgregressionradar.io/v1alpha1
kind: PostgresWatch
metadata:
  name: {{ include "deploylens.fullname" . }}-default
  labels:
    {{- include "deploylens.labels" . | nindent 4 }}
spec:
  clusterName: {{ .Values.postgres.clusterName | quote }}
  # Reuses the same Secret the operator mode's Deployment reads the DSN
  # from (templates/secret.yaml), rather than a plaintext spec.dsn field,
  # so the credential doesn't end up in `kubectl get postgreswatch -o yaml`.
  dsnSecretRef:
    name: {{ include "deploylens.fullname" . }}-secret
    key: dsn
  scrapeIntervalSeconds: {{ .Values.postgres.scrapeIntervalSeconds }}
  windowMinutes: {{ .Values.analysis.windowMinutes }}
  minSamples: {{ .Values.analysis.minSamples }}
  minExecutions: {{ .Values.analysis.minExecutions }}
  latencyChangeThreshold: {{ .Values.analysis.latencyThreshold | quote }}
  pValueThreshold: {{ .Values.analysis.pValueThreshold | quote }}
  slackWebhookUrl: {{ .Values.alerting.slackWebhookUrl | quote }}
  {{- if or .Values.alerting.format .Values.alerting.url .Values.alerting.pagerDutyRoutingKey .Values.alerting.customTemplate .Values.alerting.destinationPolicy }}
  alerting:
    {{- if .Values.alerting.format }}
    format: {{ .Values.alerting.format | quote }}
    {{- end }}
    {{- if .Values.alerting.url }}
    url: {{ .Values.alerting.url | quote }}
    {{- end }}
    {{- if .Values.alerting.pagerDutyRoutingKey }}
    pagerDutyRoutingKey: {{ .Values.alerting.pagerDutyRoutingKey | quote }}
    {{- end }}
    {{- if .Values.alerting.customTemplate }}
    customTemplate: {{ .Values.alerting.customTemplate | quote }}
    {{- end }}
    {{- if .Values.alerting.destinationPolicy }}
    destinationPolicy: {{ .Values.alerting.destinationPolicy | quote }}
    {{- end }}
  {{- end }}
  {{- if .Values.otlpExport.endpoint }}
  otlpExport:
    endpoint: {{ .Values.otlpExport.endpoint | quote }}
    encoding: {{ .Values.otlpExport.encoding | quote }}
    gzip: {{ .Values.otlpExport.gzip }}
    timeoutSeconds: {{ .Values.otlpExport.timeoutSeconds }}
    {{- if .Values.otlpExport.headers }}
    headersSecretRef:
      name: {{ include "deploylens.fullname" . }}-secret
      key: otlpHeaders
    {{- end }}
  {{- end }}
  {{- if .Values.periodicDetection.enabled }}
  periodicDetection:
    enabled: {{ .Values.periodicDetection.enabled }}
    windowMinutes: {{ .Values.periodicDetection.windowMinutes }}
    intervalMinutes: {{ .Values.periodicDetection.intervalMinutes }}
  {{- end }}
{{- end }}
