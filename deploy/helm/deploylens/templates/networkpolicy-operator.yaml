{{- if and .Values.networkPolicy.enabled (eq .Values.mode "operator") }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "deploylens.fullname" . }}-operator-default-deny
  labels:
    {{- include "deploylens.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "deploylens.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "deploylens.fullname" . }}-operator-allow
  labels:
    {{- include "deploylens.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "deploylens.selectorLabels" . | nindent 6 }}
  {{- $hasPostgres := gt (len .Values.networkPolicy.egress.postgresCIDRs) 0 }}
  {{- $hasAlertRelay := gt (len .Values.networkPolicy.egress.alertRelayCIDRs) 0 }}
  {{- $hasDNS := .Values.networkPolicy.egress.dns.enabled }}
  policyTypes:
    - Ingress
    {{- if or $hasPostgres $hasAlertRelay $hasDNS }}
    - Egress
    {{- end }}
  ingress:
    {{- if .Values.networkPolicy.ingressCIDR }}
    - from:
        - ipBlock:
            cidr: {{ .Values.networkPolicy.ingressCIDR | quote }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.webhookPort }}
        - protocol: TCP
          port: {{ .Values.service.metricsPort }}
    {{- else }}
    -
      ports:
        - protocol: TCP
          port: {{ .Values.service.webhookPort }}
        - protocol: TCP
          port: {{ .Values.service.metricsPort }}
    {{- end }}
  {{- if or $hasPostgres $hasAlertRelay $hasDNS }}
  egress:
    {{- range .Values.networkPolicy.egress.postgresCIDRs }}
    - to:
        - ipBlock:
            cidr: {{ . | quote }}
      ports:
        {{- range $.Values.networkPolicy.egress.postgresPorts }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
    {{- end }}
    {{- if .Values.networkPolicy.egress.dns.enabled }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.egress.dns.namespace | quote }}
      ports:
        - protocol: UDP
          port: {{ .Values.networkPolicy.egress.dns.port }}
        - protocol: TCP
          port: {{ .Values.networkPolicy.egress.dns.port }}
    {{- end }}
    {{- range .Values.networkPolicy.egress.alertRelayCIDRs }}
    - to:
        - ipBlock:
            cidr: {{ . | quote }}
      ports:
        {{- range $.Values.networkPolicy.egress.alertRelayPorts }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
    {{- end }}
  {{- end }}
{{- end }}
