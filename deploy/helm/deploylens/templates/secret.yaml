apiVersion: v1
kind: Secret
metadata:
  name: {{ include "deploylens.fullname" . }}-secret
  labels:
    {{- include "deploylens.labels" . | nindent 4 }}
type: Opaque
stringData:
  dsn: {{ .Values.postgres.dsn | quote }}
  slackWebhookUrl: {{ .Values.alerting.slackWebhookUrl | quote }}
  # Empty by default: the operator falls back to reusing `dsn` above as the
  # state backend's DSN (--state-dsn ""). Set Values.state.dsn to point
  # persistence at a separate Postgres instance instead.
  stateDsn: {{ .Values.state.dsn | quote }}
