{{- if eq .Values.mode "manager" }}
# Cluster-wide: PostgresWatch/DeploySource/PerformanceRegression are
# namespaced CRDs, but the manager is meant to reconcile them regardless of
# which namespace they're created in (the same shape as CloudNativePG's or
# Prometheus Operator's cluster-wide operator RBAC), so this is a
# ClusterRole/ClusterRoleBinding rather than a per-namespace Role.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "deploylens.fullname" . }}-manager-role
  labels:
    {{- include "deploylens.labels" . | nindent 4 }}
rules:
  - apiGroups: ["radar.pgregressionradar.io"]
    resources: ["postgreswatches", "deploysources"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["radar.pgregressionradar.io"]
    resources: ["postgreswatches/status", "deploysources/status", "performanceregressions/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["radar.pgregressionradar.io"]
    resources: ["performanceregressions"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  # Read-only. Backs WorkloadWatchReconciler: watching Deployment/StatefulSet
  # revision changes directly, so a DeploySource with sourceType
  # "kubernetes" can feed this project without any GitOps tool (ArgoCD/Argo
  # Rollouts/Flux) or webhook in front of the workload at all. Grants no
  # write access to workloads — this feature only ever reads rollout status.
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch"]
  {{- if .Values.manager.autoAbort.rbacEnabled }}
  # Only granted when manager.autoAbort.rbacEnabled is set. Backs
  # spec.autoAbort on PostgresWatch (see docs/auto-abort.md): grants no
  # access to anything but the one status field this project ever writes;
  # no read of spec, no create/delete of Rollouts. Off by default so a
  # cluster that doesn't use (or doesn't even have) Argo Rollouts, and
  # never sets spec.autoAbort.enabled on any PostgresWatch, doesn't get
  # this RBAC granted for nothing.
  - apiGroups: ["argoproj.io"]
    resources: ["rollouts", "rollouts/status"]
    verbs: ["get", "patch"]
  {{- end }}
  # Read-only, hub cluster only: resolves PostgresWatch.spec.dsnSecretRef
  # directly, and/or the spec.remoteClusterSecretRef kubeconfig Secret used
  # to resolve dsnSecretRef against a remote ("spoke") cluster instead —
  # see docs/multi-cluster.md. Grants no access to any remote cluster
  # itself; that comes entirely from the kubeconfig's own embedded RBAC.
  #
  # Cluster-wide and namespace-unscoped by necessity, which on its own
  # would let anyone able to create a PostgresWatch reference an arbitrary
  # Secret and have the manager read it on their behalf. Closed in code,
  # not RBAC: the manager refuses to use either Secret's contents unless
  # its owner has labeled it
  # pg-regression-radar.io/allow-postgreswatch-access=true — see
  # docs/multi-cluster.md#secret-consent-label.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "deploylens.fullname" . }}-manager-rolebinding
  labels:
    {{- include "deploylens.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "deploylens.fullname" . }}-manager-role
subjects:
  - kind: ServiceAccount
    name: {{ include "deploylens.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
# Namespace-scoped on purpose: leader election only ever needs to
# create/update one Lease object in the manager's own namespace, so it is
# kept out of the cluster-wide ClusterRole above (least privilege).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "deploylens.fullname" . }}-leader-election-role
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "deploylens.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "deploylens.fullname" . }}-leader-election-rolebinding
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "deploylens.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "deploylens.fullname" . }}-leader-election-role
subjects:
  - kind: ServiceAccount
    name: {{ include "deploylens.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
