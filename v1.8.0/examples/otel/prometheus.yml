# Minimal Prometheus config for the OTel Collector example (see
# otel-collector.yaml and prometheus-rules.yaml in this directory).
global:
  # Must be <= the receiver's top_query_collection.collection_interval so the
  # exporter's cumulative counters are sampled at least once per update.
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/prometheus-rules.yaml

scrape_configs:
  - job_name: otel-collector-pg-queries
    # honor_labels keeps any job/instance labels the exporter sets itself.
    honor_labels: true
    static_configs:
      - targets: ["otel-collector:8889"]
