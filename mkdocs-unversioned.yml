# Builds the version-independent pages (home + roadmap) of the docs site.
# These are published once, at the root of the gh-pages branch, from `main` --
# never per release, so they look identical whichever tool version a reader
# picks in the version selector. See .github/workflows/docs.yml's
# `deploy-unversioned` job and scripts/publish_unversioned_docs.py.
#
# Everything not listed here (theme, markdown extensions, hooks, ...) is
# inherited from mkdocs.yml; the sections below replace the versioned-only
# parts.
INHERIT: mkdocs.yml

site_dir: site-unversioned

# Only the two unversioned pages (plus static assets). Every other page is
# part of the versioned build; links to them from these two pages are
# rewritten to the `latest` docs by hooks.py's `on_page_markdown`.
exclude_docs: |
  /*.md
  !/index.md
  !/roadmap.md
  /adr/
  /examples/
  /policies/

# No `mike` plugin / `extra.version`: there's no version selector here.
plugins:
  - search

extra:
  pgrr_build: unversioned
  version: !!null ~

# roadmap.css / roadmap.js style the roadmap's card layout; they are only wired
# into this build because the versioned docs have no roadmap page.
extra_css:
  - stylesheets/extra.css
  - stylesheets/roadmap.css

extra_javascript:
  - javascripts/roadmap.js
  - javascripts/code-header.js
  - javascripts/callouts.js

# Same extensions as mkdocs.yml plus md_in_html (markdown inside the roadmap's
# HTML cards). Repeated in full rather than inherited, since a list in a child
# config replaces the parent's list.
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      pygments_lang_class: true
  - pymdownx.tabbed:
      alternate_style: true

# The menu is derived from mkdocs.yml's `nav` by hooks.py's `on_config`, so it
# always matches the versioned docs' menu (Home and Roadmap stay local pages;
# every other entry links into the `latest` docs).
