spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pg-regression-radar
      app.kubernetes.io/instance: pgrr
      app.kubernetes.io/component: manager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pg-regression-radar
        app.kubernetes.io/instance: pgrr
        app.kubernetes.io/component: manager
    spec:
      serviceAccountName: pgrr
      automountServiceAccountToken: true
      securityContext:
        fsGroup: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          image: "ghcr.io/joao00001/pg-regression-radar/manager:v1.9.0"
          imagePullPolicy: IfNotPresent
          args:
            - --leader-elect=false
            - --leader-election-namespace=pgrr-lab
            - --webhook-bind-address=:8080
            - --pg-metrics-bind-address=:9090
            - --metrics-bind-address=:8443
            - --health-probe-bind-address=:8081
