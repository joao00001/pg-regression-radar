apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgrr-manager
  namespace: pgrr-lab
  labels:
    helm.sh/chart: pg-regression-radar-0.0.0-lab
    app.kubernetes.io/name: pg-regression-radar
    app.kubernetes.io/instance: pgrr
    app.kubernetes.io/version: "v1.9.0"
