# Source: pg-regression-radar/templates/manager-rbac.yaml
# Cluster-wide: PostgresWatch/DeploySource/PerformanceRegression are
# namespaced CRDs, but the manager is meant to reconcile them regardless of
# which namespace they're created in (the same shape as CloudNativePG's or
# Prometheus Operator's cluster-wide operator RBAC), so this is a
# ClusterRole/ClusterRoleBinding rather than a per-namespace Role.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pgrr-manager-role
  labels:
    helm.sh/chart: pg-regression-radar-0.0.0-lab
    app.kubernetes.io/name: pg-regression-radar
    app.kubernetes.io/instance: pgrr
    app.kubernetes.io/version: "v1.9.0"
    app.kubernetes.io/managed-by: Helm
rules:
  - apiGroups: ["radar.pgregressionradar.io"]
    resources: ["postgreswatches", "deploysources", "postgresradarclusters"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["radar.pgregressionradar.io"]
    resources: ["postgreswatches/status", "deploysources/status", "performanceregressions/status", "postgresradarclusters/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["radar.pgregressionradar.io"]
    resources: ["performanceregressions"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  # Read-only. Backs WorkloadWatchReconciler: watching Deployment/StatefulSet
  # revision changes directly, so a DeploySource with sourceType
  # "kubernetes" can feed this project without any GitOps tool (ArgoCD/Argo
  # Rollouts/Flux) or webhook in front of the workload at all. Grants no
  # write access to workloads — this feature only ever reads rollout status.
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch"]
  # Read-only, hub cluster only: resolves PostgresWatch.spec.dsnSecretRef
  # directly, and/or the spec.remoteClusterSecretRef kubeconfig Secret used
  # to resolve dsnSecretRef against a remote ("spoke") cluster instead —
  # see docs/multi-cluster.md. Grants no access to any remote cluster
  # itself; that comes entirely from the kubeconfig's own embedded RBAC.
  #
  # Cluster-wide and namespace-unscoped by necessity, which on its own
  # would let anyone able to create a PostgresWatch reference an arbitrary
  # Secret and have the manager read it on their behalf. Closed in code,
  # not RBAC: the manager refuses to use either Secret's contents unless
  # its owner has labeled it
  # pg-regression-radar.io/allow-postgreswatch-access=true — see
  # docs/multi-cluster.md#secret-consent-label.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
