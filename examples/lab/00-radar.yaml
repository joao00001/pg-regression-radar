    - jsonPath: .spec.clusterName
      name: Cluster
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.trackedQueryIds
      name: Tracked Queries
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          PostgresWatch declares a Postgres cluster to monitor for query
          performance regressions correlated with Kubernetes deploys.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              PostgresWatchSpec declares which Postgres cluster to monitor, how
              aggressively to sample it, and the thresholds that decide whether a
              latency shift counts as a regression. It is consumed by
              PostgresWatchReconciler, which translates it into a
              internal/collector.Config and internal/correlation.Config pair.
            properties:
              adjustAutocorrelation:
                description: |-
                  adjustAutocorrelation widens Welch's t-test for serial correlation
                  between consecutive scrapes by shrinking each segment to its effective
                  sample size, so correlated noise (a cache warming, a batch job) is less
                  often mistaken for a regression. It can only raise p-values. Off by
                  default. See
                  docs/detection-algorithm.md#controlling-false-positives-across-many-queries.
                type: boolean
              alerting:
                description: |-
                  alerting configures how detected regressions are reported and
                  supersedes slackWebhookUrl. Leave unset to keep using
                  slackWebhookUrl (or no alerting at all, if that's empty too) exactly
                  as before this field existed. See docs/alerting.md for the full list
                  of supported formats and the custom template's available fields.
                properties:
                  customTemplate:
                    description: |-
                      customTemplate is Go text/template source used to render the
                      notification body when format is "custom". Required, and only used,
                      when format is "custom" — see docs/alerting.md#custom-format for the
                      available template fields and a worked example.
                    type: string
                  destinationPolicy:
                    description: |-
                      destinationPolicy controls how the alerting destination URL is
                      validated and resolved. Three modes are supported:

                      "permissive" (default): the URL is accepted as long as it passes the
                      static SSRF blocklist (no loopback, no link-local, no cloud-metadata
                      hostnames). This matches the pre-existing behaviour and is
                      backward-compatible with all existing installations.

                      "allowlist": the URL's host must also appear in the
                      --alerting-allowed-destinations list configured at the operator or
                      manager level. Reconciliation fails with a clear message if the host
                      is not in the list. Use this in multi-tenant clusters where only a
                      pre-approved set of receivers should be reachable.

                      "relay-only": the CRD-level URL is ignored entirely; the notifier
                      always sends to the relay URL supplied via
                      --alerting-destination-policy-relay-url. Reconciliation fails if
                      that flag is empty. Use this when you want a single, centrally
                      controlled egress point that individual watch owners cannot override.

                      Leave unset to get "permissive" behaviour — no breaking change for
                      existing installations.
                    enum:
                    - permissive
                    - allowlist
                    - relay-only
                    type: string
                  format:
                    description: |-
                      format selects the notification payload layout. Leave unset (or set
                      to "slack") for the original Slack-compatible incoming-webhook
                      payload.
                    enum:
                    - slack
                    - teams
                    - pagerduty
                    - custom
                    type: string
                  pagerDutyRoutingKey:
                    description: |-
                      pagerDutyRoutingKey is the PagerDuty Events API v2 integration
                      (routing) key. Required, and only used, when format is "pagerduty".
                    type: string
                  url:
                    description: |-
                      url is the webhook endpoint for the slack, teams, and custom
                      formats. Ignored for pagerduty, which always posts to PagerDuty's
                      fixed Events API v2 endpoint instead — see pagerDutyRoutingKey.
                    type: string
                type: object
              attribution:
                description: |-
                  attribution optionally runs the counterfactual attribution engine in
                  shadow mode next to the existing detector: every tracked deploy is
                  judged against a control built from queries the deploy did not touch,
                  and the decision it would take (alert, hold, roll back) is logged and
                  exported as a metric, but never executed. nil (the default) means
                  disabled. See docs/attribution-engine.md.
                properties:
                  enabled:
                    default: false
                    description: enabled turns the engine on for this watch.
                    type: boolean
                  mode:
                    default: shadow
                    description: |-
                      mode is "shadow" (the default) or "enforce". In shadow mode the
                      verdict served to a rollout controller is always "pass" and the action
                      the engine would have taken is only reported. In enforce mode the
                      verdict is "inconclusive" (pause the rollout) for grade B evidence and
                      "fail" (abort it) for grade A. Nothing is written to the cluster by this
                      manager in either mode: the rollout controller acts on the verdict.
                    enum:
                    - shadow
                    - enforce
                    type: string
                  revert:
                    description: |-
                      revert opens a draft pull request that reverts the change behind a
                      deploy the engine has convicted. It is never merged by this manager. Only
                      deploys whose revision is a full git commit SHA (an Argo CD source, or a
                      generic one that reports the commit) can be reverted; in shadow mode the
                      pull request that would be opened is only logged.
                    properties:
                      apiURL:
                        description: |-
                          apiURL is the GitHub REST API root, for GitHub Enterprise Server
                          (https://host/api/v3). It must be https: the token is sent to it.
                        pattern: ^https://.+
                        type: string
                      enabled:
                        default: false
                        description: enabled turns the revert proposal on.
                        type: boolean
                      includeQueryText:
                        default: false
                        description: |-
                          includeQueryText adds the normalised text of the affected queries to the
                          pull request. Off by default: the repository may be public, and a
                          query's text names tables and columns.
                        type: boolean
                      maxPerDay:
                        default: 3
                        description: maxPerDay caps the revert pull requests opened in any 24 hours.
                        format: int32
                        maximum: 20
                        minimum: 1
                        type: integer
                      repository:
                        description: |-
                          repository is the GitHub repository whose history holds the deployed
                          commit, as owner/name.
                        pattern: ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$
                        type: string
                      tokenSecretRef:
                        description: |-
                          tokenSecretRef is a Secret key holding a GitHub token that can open
                          pull requests in repository (fine-grained: Pull requests and Contents,
                          read and write, on that repository only). The Secret must carry the
                          pg-regression-radar.io/allow-postgreswatch-access=true label.
                        properties:
                          key:
                            description: key within the Secret's Data.
                            type: string
                          name:
                            description: name of the referenced Secret.
                            type: string
                        required:
                        - key
                        - name
                        type: object
                    required:
                    - enabled
                    - repository
                    - tokenSecretRef
                    type: object
                required:
                - enabled
                type: object
              autoAbort:
                description: |-
                  autoAbort optionally closes the loop between detection and
                  remediation: when set and enabled, a sufficiently confident detected
                  regression automatically aborts the Argo Rollouts canary that caused
                  it, instead of only alerting and waiting for a human to do it. See
                  docs/auto-abort.md for the full safety model. nil (the default) means
                  disabled -- this manager never touches any Rollout object unless a
                  PostgresWatch explicitly opts in.
                properties:
                  confidenceThreshold:
                    default: "0.99"
                    description: |-
                      confidenceThreshold is the minimum PerformanceRegression
                      confidenceScore (1 - Welch's t-test p-value) required before this
                      manager will abort a rollout automatically, on top of it already
                      having cleared pValueThreshold to be reported as Detected at all.
                      Deliberately conservative by default: auto-abort is meant to fire
                      only on the clearest possible signals, not on every detection that
                      merely clears the ordinary alerting bar.
                    type: string
                  enabled:
                    default: false
                    description: |-
                      enabled turns on automatic abortion for this watch. Every other field
                      below is ignored while this is false.
                    type: boolean
                required:
                - enabled
                type: object
              capturePlans:
                description: |-
                  capturePlans enables plan-diff correlation for this watch: around a
                  detected regression, the Collector captures the query's execution
                  plan from pg_store_plans (if installed) or falls back to
                  EXPLAIN (FORMAT JSON, GENERIC_PLAN) (PostgreSQL 16+), and a short
                  diff is attached to the resulting PerformanceRegression's
                  status.planDiffSummary. See internal/planner and
                  docs/detection-algorithm.md#plan-diff-correlation-optional. Mirrors
                  the standalone `operator` CLI's --capture-plans flag; disabled by
                  default because it adds a per-scrape-cycle EXPLAIN/lookup cost.
                type: boolean
              clusterName:
                description: |-
                  clusterName identifies the CloudNativePG (or other) Cluster resource
                  being watched. It is attached to Prometheus metrics and to any
                  PerformanceRegression created from this watch.
                minLength: 1
                type: string
              cnpgClusterRef:
                description: |-
                  cnpgClusterRef optionally names a CloudNativePG `Cluster` resource
                  (postgresql.cnpg.io/v1) to validate before trusting dsnSecretRef's
                  contents. When set, resolveDSN additionally fetches that Cluster
                  object — through the exact same client and in the exact same
                  namespace dsnSecretRef itself is read from/in (the hub cluster by
                  default, or the cluster named by remoteClusterRef/
                  remoteClusterSecretRef when either is set) — and fails DSN
                  resolution, exactly like any other DSN resolution error
                  (status.phase: Failed), if that Cluster doesn't exist or isn't
                  reporting a healthy status. "Healthy" means a `status.conditions`
                  entry of `type: Ready, status: "True"` when CloudNativePG reports
                  one (recent versions always do), falling back to `status.phase` not
                  indicating a failure state for older CloudNativePG versions that
                  predate the Ready condition.

                  Leave unset (the default) to keep today's behavior: only the
                  generated DSN Secret is ever read, and this project has no opinion
                  on whether the CloudNativePG Cluster that generated it is itself
                  healthy. See docs/multi-cluster.md#remote-cloudnativepg-cluster-validation.
                type: string
              criticalQueryIDs:
                description: |-
                  criticalQueryIDs bypass minSamples and minExecutions so SLA-critical queries are
                  always evaluated even when rarely called.
                items:
                  format: int64
                  type: integer
                type: array
              dsn:
                description: |-
                  dsn is the Postgres connection string used by the Collector.
                  For production use, prefer dsnSecretRef so the credential is not
                  stored in the CR itself; dsn takes precedence when both are set.
                type: string
              dsnSecretRef:
                description: |-
                  dsnSecretRef points at a Secret key holding the Postgres DSN, keeping
                  credentials out of the CR spec (and out of `kubectl get -o yaml`).
                  By default this Secret is read from the same Kubernetes cluster the
                  manager runs in (the "hub"). Set remoteClusterSecretRef to read it
                  from a different ("spoke") cluster instead.
                properties:
                  key:
                    description: key within the Secret's Data.
                    type: string
                  name:
                    description: name of the referenced Secret.
                    type: string
                required:
                - key
                - name
                type: object
              latencyChangeThreshold:
                default: "0.20"
                description: |-
                  latencyChangeThreshold is the minimum relative mean-latency increase
                  (e.g. 0.20 == +20%) required before the statistical test even runs.
                  Raise it in high-churn environments to cut noise.
                type: string
              minExecutions:
                default: 100
                description: |-
                  minExecutions is the minimum number of executions of the query,
                  summed over the observations, required in each of the pre- and
                  post-deploy windows. It does not apply to sample sources that report
                  no call counts (the Prometheus source), which are gated by minSamples
                  alone.
                format: int64
                minimum: 1
                type: integer
              minSamples:
                default: 10
                description: |-
                  minSamples is the minimum number of latency observations (scrape
                  intervals in which the query ran) required in each of the pre- and
                  post-deploy windows.
                format: int64
                minimum: 1
                type: integer
              multipleTesting:
                default: none
                description: |-
                  multipleTesting controls the false-discovery rate across the queries
                  of one analysis pass. A pass judges up to the top 500 queries, so even
                  with every individual test at pValueThreshold some unchanged queries
                  are flagged by chance. "none" (the default) judges each query on its own
                  p-value, as before. "bh" applies the Benjamini-Hochberg step-up at level
                  pValueThreshold and "by" the stricter Benjamini-Yekutieli step-up, which
                  holds under any dependence between queries. Both only remove detections,
                  at a cost in sensitivity. See
                  docs/detection-algorithm.md#controlling-false-positives-across-many-queries.
                enum:
                - none
                - bh
                - by
                type: string
              otlpExport:
                description: |-
                  otlpExport optionally publishes every detected regression as an
                  OpenTelemetry log record (OTLP/HTTP, POST <endpoint>/v1/logs) in
                  addition to whatever spec.alerting does. nil (the default) means
                  disabled. See docs/otlp-export.md for the record's attributes and
                  the trace link back to an OTLP-sourced deploy.
                properties:
                  encoding:
                    default: protobuf
                    description: encoding selects the OTLP/HTTP payload format.
                    enum:
                    - protobuf
                    - json
                    type: string
                  endpoint:
                    description: |-
                      endpoint is the OTLP/HTTP base URL of the receiving collector or
                      backend, e.g. "http://otel-collector.observability:4318". "/v1/logs"
                      is appended unless already present. Must be http or https, must not
                      embed credentials (use headersSecretRef), and is subject to the same
                      manager-wide destination checks as alert destinations
                      (--alerting-allowed-destinations, loopback/metadata hosts blocked,
                      and rejected entirely under the relay-only destination policy).
                    minLength: 1
                    type: string
                  gzip:
                    description: gzip compresses request bodies.
                    type: boolean
                  headersSecretRef:
                    description: |-
                      headersSecretRef points at a Secret key holding extra request
                      headers in the OTEL_EXPORTER_OTLP_HEADERS format
                      ("Authorization=Bearer%20abc,x-tenant=acme"), for authenticated
                      backends. The Secret must carry the
                      pg-regression-radar.io/allow-postgreswatch-access=true label, like
                      every other Secret a PostgresWatch references.
                    properties:
                      key:
                        description: key within the Secret's Data.
                        type: string
                      name:
                        description: name of the referenced Secret.
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  timeoutSeconds:
                    description: timeoutSeconds bounds each delivery attempt. Defaults
                      to 10.
                    format: int32
                    maximum: 120
                    minimum: 1
                    type: integer
                required:
                - endpoint
                type: object
              pValueThreshold:
                default: "0.05"
                description: |-
                  pValueThreshold is the Welch's t-test significance cutoff. Lower
                  values increase specificity at the cost of sensitivity.
                type: string
              periodicDetection:
                description: |-
                  periodicDetection optionally runs regression detection on a rolling
                  schedule, independent of any tracked deploy: no DeploySource or
                  DeployEvent is required for it to fire. See
                  docs/periodic-detection.md, including its false-positive caveat --
                  this is a materially different, less deploy-anchored kind of
                  detection than the rest of this project's default behaviour. nil
                  (the default) means disabled -- this watch behaves exactly as before
                  this field existed unless explicitly opted in.
                properties:
                  enabled:
                    default: false
                    description: |-
                      enabled turns on periodic detection for this watch. Every other field
                      below is ignored while this is false.
                    type: boolean
                  intervalMinutes:
                    default: 15
                    description: |-
                      intervalMinutes is how often a full periodic analysis pass runs over
                      every tracked query.
                    format: int32
                    minimum: 1
                    type: integer
                  windowMinutes:
                    default: 60
                    description: |-
                      windowMinutes sizes the rolling window that gets split in half
                      (recent vs. previous) to look for a regression with no deploy event
                      to anchor to. Deliberately independent from (and, by default,
                      double) the deploy-triggered spec.windowMinutes default: periodic
                      analysis has no deploy nearby to narrow down where to look, so a
                      shorter window would be noisier.
                    format: int32
                    minimum: 1
                    type: integer
                required:
                - enabled
                type: object
              remoteClusterRef:
                description: |-
                  remoteClusterRef names a PostgresRadarCluster resource (cluster-scoped)
                  that was pre-registered by an administrator. When set, dsnSecretRef is
                  resolved against the remote cluster described by that
                  PostgresRadarCluster instead of the hub — only clusters explicitly
                  registered by an administrator can be referenced here, which eliminates
                  the confused-deputy risk of arbitrary kubeconfig references. The named
                  PostgresRadarCluster must exist; reconciliation fails if it does not.

                  Takes precedence over remoteClusterSecretRef when both are set.
                  See docs/multi-cluster.md#cluster-registry for the full model.
                type: string
              remoteClusterSecretRef:
                description: |-
                  remoteClusterSecretRef points at a Secret, in the hub cluster and in
                  this PostgresWatch's namespace, whose key holds a kubeconfig (raw
                  YAML or JSON, the same format `kubectl config view --raw` produces)
                  for a remote ("spoke") Kubernetes cluster. When set, dsnSecretRef is
                  resolved against that remote cluster instead of the hub — the
                  pattern fleet tools like Cluster API, Argo CD, and Open Cluster
                  Management use to let a central controller reach resources living in
                  a different cluster. See docs/multi-cluster.md for the full model,
                  including the least-privilege expectation on the kubeconfig itself:
                  it should grant nothing beyond reading the one Secret dsnSecretRef
                  names, in the remote cluster.

                  Deprecated: use remoteClusterRef with a registered PostgresRadarCluster
                  instead. In hardened security-profile mode this field is rejected
                  outright; in controlled mode (the default) it continues to work but
                  logs a deprecation warning. See docs/multi-cluster.md#migration.

                  Leave unset (the default) when the Postgres cluster being watched is
                  reachable over the network from the manager and its DSN Secret lives
                  in this same (hub) cluster — the common case when CloudNativePG runs
                  alongside the manager. This field only changes *where the DSN Secret
                  is read from*; it has no effect when dsn is set directly instead of
                  dsnSecretRef.
                properties:
                  key:
                    description: key within the Secret's Data.
                    type: string
                  name:
                    description: name of the referenced Secret.
                    type: string
                required:
                - key
                - name
                type: object
              remoteNamespace:
                description: |-
                  remoteNamespace overrides which namespace dsnSecretRef is looked up
                  in on the remote cluster when remoteClusterSecretRef is set. Only
                  meaningful alongside remoteClusterSecretRef; ignored otherwise.

                  Leave unset (the default) when the spoke cluster's namespace for
                  this workload has the same name as this PostgresWatch's own
                  namespace in the hub cluster — the convention CloudNativePG's own
                  generated credential Secrets follow, and the common case for a
                  fleet with matching hub/spoke namespace naming. Set it when your
                  fleet's naming conventions don't line up 1:1 between hub and spoke
                  (e.g. hub namespace "prod-eu-west" but the spoke cluster's own
                  CloudNativePG Cluster lives in a namespace simply called
                  "postgres"). See docs/multi-cluster.md.
                type: string
              sampleSource:
                description: |-
                  sampleSource optionally selects an alternative source of query
                  samples in place of this watch's own internal/collector.Collector
                  scrape loop. nil (the default) means: collector.Collector connects
                  directly to dsn/dsnSecretRef and scrapes pg_stat_statements itself,
                  exactly as before this field existed -- dsn/dsnSecretRef remain
                  required in that case. Set this to point the watch at a Prometheus
                  HTTP API instead (fed by an OpenTelemetry Collector) when the
                  target database is already scraped that way and a second direct
                  scraper isn't wanted -- see
                  docs/otel-prometheus-source.md, including the real
                  per-query-attribution caveat that path requires operators to
                  address themselves before it returns any data.
                properties:
                  prometheus:
                    description: |-
                      prometheus configures the "prometheus" type. Required, and only
                      used, when type is "prometheus".
                    properties:
                      bearerTokenSecretRef:
                        description: |-
                          bearerTokenSecretRef points at a Secret key holding a bearer token
                          sent as "Authorization: Bearer <token>" on every request, for a
                          Prometheus-compatible API behind an authenticating proxy. The Secret
                          must carry the pg-regression-radar.io/allow-postgreswatch-access=true
                          label.
                        properties:
                          key:
                            description: key within the Secret's Data.
                            type: string
                          name:
                            description: name of the referenced Secret.
                            type: string
                        required:
                        - key
                        - name
                        type: object
                      metricName:
                        description: |-
                          metricName is the Prometheus metric samples are read from. Required
                          -- there is deliberately no default pointing at
                          postgresqlreceiver's stock postgresql.query.execution.time metric,
                          which has no per-query attribution as of this writing. See
                          docs/otel-prometheus-source.md for what to point this at instead.
                        minLength: 1
                        type: string
                      queryIDLabel:
                        description: |-
                          queryIDLabel is the label carrying a query's pg_stat_statements
                          queryid, as a base-10 integer string. Defaults to "queryid"
                          (promsource.Config's own default) when left unset.
                        type: string
                      queryTextLabel:
                        description: |-
                          queryTextLabel is the label carrying the query's text. Defaults to
                          "query" (promsource.Config's own default) when left unset; set to
                          "-" to explicitly disable the lookup.
                        type: string
                      stepSeconds:
                        description: |-
                          stepSeconds is the query_range resolution. Defaults to 15
                          (promsource.Config's own default) when left unset or zero.
                        format: int32
                        minimum: 1
                        type: integer
                      url:
                        description: |-
                          url is the Prometheus HTTP API base, e.g. "http://prometheus:9090"
                          (no trailing slash required, no "/api/v1/..." suffix).
                        minLength: 1
                        type: string
                    required:
                    - metricName
                    - url
                    type: object
                  type:
                    default: collector
                    description: |-
                      type selects the SampleSource implementation. "collector" (the
                      default, whether this field is set explicitly or the whole
                      sampleSource field is left nil) uses internal/collector.Collector,
                      connected via dsn/dsnSecretRef, exactly as before this field
                      existed. "prometheus" uses internal/telemetry/promsource against a
                      Prometheus HTTP API instead -- dsn/dsnSecretRef are not required
                      (and not read) in that case, but capturePlans is: EXPLAIN-based
                      plan-diff capture needs a direct database connection this mode
                      deliberately doesn't have, so a watch with capturePlans: true and
                      sampleSource.type: prometheus fails reconciliation with a clear
                      error rather than silently skipping plan-diff capture.
                    enum:
                    - collector
                    - prometheus
                    type: string
                type: object
              scrapeIntervalSeconds:
                default: 60
                description: |-
                  scrapeIntervalSeconds controls how often pg_stat_statements is
                  scraped. Lower values increase detection granularity at the cost of
                  DB load.
                format: int32
                minimum: 5
                type: integer
              slackWebhookUrl:
                description: |-
                  slackWebhookURL is a Slack (or Slack-compatible) incoming webhook
                  used by internal/alerting to notify on detected regressions.

                  Deprecated: use alerting instead (leaving format unset, or set to
                  "slack", is equivalent). Ignored entirely whenever alerting is set —
                  kept only so watches created before alerting existed keep working
                  unchanged.
                type: string
              windowMinutes:
                default: 30
                description: |-
                  windowMinutes is the analysis window on each side of a deploy. Wider
                  windows smooth noise but delay detection.
                format: int32
                minimum: 1
                type: integer
            required:
            - clusterName
            type: object
          status:
            description: PostgresWatchStatus reflects the observed state of the background
              worker.
            properties:
              conditions:
                description: conditions represent the current state of the PostgresWatch
                  resource.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastScrapeTime:
                description: |-
                  lastScrapeTime is the timestamp of the most recent successful
                  pg_stat_statements scrape reported by the Collector.
                format: date-time
                type: string
              message:
                description: |-
                  message carries a human-readable explanation, most useful when
                  phase is Failed.
                type: string
              observedGeneration:
