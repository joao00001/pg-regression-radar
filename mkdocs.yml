site_name: pg-regression-radar
site_description: >-
  Detects PostgreSQL query performance regressions and pinpoints which
  Kubernetes deployment caused them.
site_url: https://joao00001.github.io/pg-regression-radar/
repo_url: https://github.com/joao00001/pg-regression-radar
repo_name: joao00001/pg-regression-radar
edit_uri: edit/main/docs/

theme:
  name: material
  # overrides/main.html overrides the `outdated` block to show a banner on
  # any version other than `latest` — see
  # https://squidfunk.github.io/mkdocs-material/setup/setting-up-versioning/#version-warning
  custom_dir: overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.sections
    - navigation.indexes
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight

hooks:
  - hooks.py

# Declaring `plugins:` explicitly replaces MkDocs' implicit default plugin
# list (which is just `search`) rather than adding to it — `search` is
# listed here for that reason, not because it's new. `mike` wires up
# Material's version selector below; the actual `mike deploy`/`mike
# set-default` commands that publish a version only run in
# .github/workflows/docs.yml's `deploy` job — a plain `mkdocs build`
# (what the `check` job runs on every PR) works fine with this plugin
# present and does not require a `versions.json` to already exist.
plugins:
  - search
  - mike

extra:
  version:
    provider: mike
    # Show the alias (e.g. "latest") next to the version number in the
    # selector, not just the bare version string — see
    # https://squidfunk.github.io/mkdocs-material/setup/setting-up-versioning/#version-alias
    alias: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/nav-data.js
  - javascripts/nav-flyout.js
  - javascripts/version-flyout.js

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.tabbed:
      alternate_style: true

# Grouped into a handful of umbrella top-level tabs on purpose: this repo
# started with 14 flat top-level entries, more than fit in the tabs bar at
# any viewport width, forcing a hidden horizontal scroll. Related pages are
# grouped under a shared parent instead (mirroring how e.g. apple.com's top
# nav works: hovering "Get Started"/"Reference"/"Contributing" expands the
# header downward to reveal its pages — see docs/javascripts/nav-flyout.js
# and hooks.py, which feeds it the tree below). "Home" has nothing that
# needs grouping, so it stays a standalone entry per the "pages that don't
# need it can stay on their own" rule.
nav:
  - Home: index.md
  - Changelog: changelog.md
  - Get Started:
      - Installation: installation.md
      - Getting Started: getting-started.md
  - Architecture:
      - architecture.md
      - Detection Algorithm: detection-algorithm.md
      - Collector Internals: collector-internals.md
      - Multi-Cluster (Fleet) Mode: multi-cluster.md
  - Reference:
      - Configuration Reference: configuration.md
      - API Reference: api-reference.md
      - API Versioning & Compatibility: api-versioning.md
      - Persistence: persistence.md
      - Deploy Sources & Webhooks: webhooks.md
      - Support Matrix: support-matrix.md
  - Contributing:
      - Testing: testing.md
      - CI/CD: ci-cd.md
      - Branch Protection: branch-protection.md
      - Roadmap: roadmap.md
      - Page Template: TEMPLATE.md
      - Contributing Guide: https://github.com/joao00001/pg-regression-radar/blob/main/CONTRIBUTING.md
