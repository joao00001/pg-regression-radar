site_name: pg-regression-radar
site_description: >-
  Detects PostgreSQL query performance regressions and pinpoints which
  Kubernetes deployment caused them.
site_url: https://joao00001.github.io/pg-regression-radar/
repo_url: https://github.com/joao00001/pg-regression-radar
repo_name: joao00001/pg-regression-radar
edit_uri: edit/main/docs/

theme:
  name: material
  # overrides/main.html overrides the `outdated` block to show a banner on
  # any version other than `latest` — see
  # https://squidfunk.github.io/mkdocs-material/setup/setting-up-versioning/#version-warning
  custom_dir: overrides
  icon:
    logo: pgrr/mark
    repo: fontawesome/brands/github
  favicon: assets/brand/favicon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight

hooks:
  - hooks.py

# This config builds the *versioned* docs only. The home page and the
# roadmap are deliberately independent of tool versions: they're built from
# `main` by mkdocs-unversioned.yml and published once, at the site root --
# see .github/workflows/docs.yml. Links to them from versioned pages are
# rewritten to those root URLs by hooks.py's `on_page_markdown`.
exclude_docs: |
  /index.md
  /roadmap.md
  /playground.md
  /our-math.md
  /assets/playground/
  /assets/math/
  /javascripts/vendor/README.md

# Declaring `plugins:` explicitly replaces MkDocs' implicit default plugin
# list (which is just `search`) rather than adding to it — `search` is
# listed here for that reason, not because it's new. `mike` wires up
# Material's version selector below; the actual `mike deploy`/`mike
# set-default` commands that publish a version only run in
# .github/workflows/docs.yml's `deploy` job — a plain `mkdocs build`
# (what the `check` job runs on every PR) works fine with this plugin
# present and does not require a `versions.json` to already exist.
plugins:
  - search
  - mike

extra:
  pgrr_build: versioned
  version:
    provider: mike
    # Show the alias (e.g. "latest") next to the version number in the
    # selector, not just the bare version string — see
    # https://squidfunk.github.io/mkdocs-material/setup/setting-up-versioning/#version-alias
    alias: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/version-flyout.js
  - javascripts/code-header.js
  - javascripts/theme-toggle.js
  - javascripts/callouts.js
  - javascripts/steps.js
  - javascripts/toc-indicator.js

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      pygments_lang_class: true
  - pymdownx.tabbed:
      alternate_style: true

# The top level is the header's tab bar (`navigation.tabs`): Home, Playground,
# Our math and Roadmap are absolute links to the unversioned site (see `exclude_docs`
# above), identical from every version, and everything else lives under Docs,
# whose groups are the left sidebar. The groups start collapsed and only the one
# holding the current page is open (no `navigation.expand`), the way
# kubernetes.io's sidebar works; a reader opens the others as needed. Keep group
# names to one or two words and page titles short: they have to fit the sidebar
# without wrapping. A page's own `# Title` can stay long; the entry here is only
# its label in the menu. On a narrow screen the tabs fold into the sidebar
# drawer. The first page of Docs is what its tab opens, so keep Get started first.
nav:
  - Home: https://joao00001.github.io/pg-regression-radar/
  - Playground: https://joao00001.github.io/pg-regression-radar/playground/
  - Our math: https://joao00001.github.io/pg-regression-radar/our-math/
  - Docs:
      - Get started:
          - Try the lab: lab.md
          - Install: installation.md
          - Quickstart: getting-started.md
          - Validate your setup: quickstart-validation.md
          - Troubleshooting and FAQ: troubleshooting.md
          - "Example: a regression": examples/regression-scenario.md
          - "Example: alerting": examples/alerting-example.md
      - Concepts:
          - Architecture: architecture.md
          - Detection algorithm: detection-algorithm.md
          - Collector internals: collector-internals.md
          - Periodic detection: periodic-detection.md
          - Multi-cluster: multi-cluster.md
          - Auto-abort: auto-abort.md
      - Integrations:
          - Deploy sources: webhooks.md
          - Alerting: alerting.md
          - Prometheus / OTel source: otel-prometheus-source.md
          - OTLP deploy events: otlp-deploy-events.md
          - OTLP export: otlp-export.md
      - Security:
          - Security model: security-model.md
          - Hardening (Helm): deployment-security.md
          - Supply chain: supply-chain.md
      - Reference:
          - Configuration: configuration.md
          - API: api-reference.md
          - API versioning: api-versioning.md
          - Persistence: persistence.md
          - Upgrading: upgrading.md
          - Support matrix: support-matrix.md
      - Basic Kubernetes:
          - Overview: kubernetes/overview.md
          - Objects and namespaces: kubernetes/objects.md
          - Pods and Deployments: kubernetes/workloads.md
          - Config and Secrets: kubernetes/config-secrets.md
          - Services and networking: kubernetes/networking.md
          - CRDs and operators: kubernetes/crds-operators.md
          - RBAC and access: kubernetes/rbac.md
          - Helm basics: kubernetes/helm.md
          - Troubleshooting toolkit: kubernetes/troubleshooting.md
      - Contribute:
          - Testing: testing.md
          - CI/CD: ci-cd.md
          - Backporting: backporting.md
          - Branch protection: branch-protection.md
          - Page template: TEMPLATE.md
          - Contributing guide ↗: https://github.com/joao00001/pg-regression-radar/blob/main/CONTRIBUTING.md
      - Changelog: changelog.md
  - Roadmap: https://joao00001.github.io/pg-regression-radar/roadmap/
