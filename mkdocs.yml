site_name: pg-regression-radar
site_description: >-
  Detects PostgreSQL query performance regressions and pinpoints which
  Kubernetes deployment caused them.
site_url: https://joao00001.github.io/pg-regression-radar/
repo_url: https://github.com/joao00001/pg-regression-radar
repo_name: joao00001/pg-regression-radar
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.sections
    - navigation.indexes
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight

hooks:
  - hooks.py

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/nav-data.js
  - javascripts/nav-flyout.js

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.tabbed:
      alternate_style: true

# Grouped into a handful of umbrella top-level tabs on purpose: this repo
# started with 14 flat top-level entries, more than fit in the tabs bar at
# any viewport width, forcing a hidden horizontal scroll. Related pages are
# grouped under a shared parent instead (mirroring how e.g. apple.com's top
# nav works: hovering "Get Started"/"Reference"/"Contributing" expands the
# header downward to reveal its pages — see docs/javascripts/nav-flyout.js
# and hooks.py, which feeds it the tree below). "Home" has nothing that
# needs grouping, so it stays a standalone entry per the "pages that don't
# need it can stay on their own" rule.
nav:
  - Home: index.md
  - Get Started:
      - Installation: installation.md
      - Getting Started: getting-started.md
  - Architecture:
      - architecture.md
      - Detection Algorithm: detection-algorithm.md
      - Collector Internals: collector-internals.md
      - Multi-Cluster (Fleet) Mode: multi-cluster.md
  - Reference:
      - Configuration Reference: configuration.md
      - API Reference: api-reference.md
      - API Versioning & Compatibility: api-versioning.md
      - Persistence: persistence.md
      - Deploy Sources & Webhooks: webhooks.md
      - Support Matrix: support-matrix.md
  - Contributing:
      - Testing: testing.md
      - CI/CD: ci-cd.md
      - Branch Protection: branch-protection.md
      - Roadmap: roadmap.md
      - Page Template: TEMPLATE.md
      - Contributing Guide: https://github.com/joao00001/pg-regression-radar/blob/main/CONTRIBUTING.md
