version: 2 
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"

  - package-ecosystem: docker
    # Single multi-stage Dockerfile at the repo root builds all five
    # container images (cli/operator/manager/collector/ingester) — see
    # release.yml's top comment. Covers the base image(s) in its FROM
    # lines; version-bump PRs here catch base-image security patches the
    # same way the gomod entry above catches Go dependency ones.
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
