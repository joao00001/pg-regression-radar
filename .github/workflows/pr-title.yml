name: PR title

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  check-title:
    name: Enforce Conventional Commits title
    runs-on: ubuntu-latest
    steps:
      # The PR title becomes the squash-merge commit message on main (see
      # CONTRIBUTING.md), so it's enforced the same way a commit message
      # would be. Types/scopes here must stay in sync with the tables in
      # CONTRIBUTING.md's "Commit messages: Conventional Commits" section.
      - name: Validate title against Conventional Commits
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            test
            refactor
            perf
            chore
            ci
          scopes: |
            collector
            correlation
            ingester
            alerting
            storage
            controller
            api
            operator
            manager
            helm
            e2e
            ci
            deps
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The PR title's summary should start with a lowercase letter (e.g. "fix(collector): bound sample retention", not "Fix(collector): Bound sample retention").
