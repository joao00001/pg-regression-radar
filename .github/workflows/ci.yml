name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  helm-render-test:
    name: Helm render tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Install yq
        # ubuntu-latest runners ship yq; pin to a known-good release to
        # guard against unexpected version changes.
        run: |
          YQ_VERSION=4.44.6
          sudo curl -fsSL "https://github.com/mikefarah/yq/releases/download/v${YQ_VERSION}/yq_linux_amd64" \
            -o /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Run consent-label render test
        run: bash deploy/helm/deploylens/tests/consent-label.sh

      - name: Run security-context render test
        run: bash deploy/helm/deploylens/tests/security-context.sh

      - name: Run security-hardening render test
        run: bash deploy/helm/deploylens/tests/security-hardening.sh

  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test (with coverage)
        run: go test -race -count=1 -coverprofile=coverage.out ./...

      # Reports coverage on every run — visibility, not a gate: this repo
      # deliberately does not fail CI below some blanket percentage. Unit
      # coverage means different things for different packages (pure logic
      # like internal/correlation/internal/alerting can reasonably approach
      # 100%; internal/collector/internal/storage/postgres's real-Postgres
      # code paths are correctly 0% *here* and covered instead by the
      # integration-postgres job below; generated code and thin cmd/*
      # wiring aren't meaningfully coverable at all) — see docs/testing.md
      # for the tiered expectations this number should be read against,
      # rather than chasing one aggregate target.
      - name: Coverage summary
        if: always()
        run: |
          {
            echo "### Unit test coverage (this job only — see integration-postgres for real-Postgres coverage)"
            echo
            echo '```'
            go tool cover -func=coverage.out | tail -1
            echo '```'
            echo
            echo "<details><summary>Per-package breakdown</summary>"
            echo
            echo '```'
            go tool cover -func=coverage.out
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage profile
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-unit
          path: coverage.out
          retention-days: 14

  # Runs the tests behind the "integration" build tag against a real
  # PostgreSQL server (internal/storage/postgres, internal/collector),
  # instead of the fakes/mocks the default build-and-test job uses. See each
  # test file's doc comment for how to run it the same way locally.
  #
  # Matrixed across every PostgreSQL major version in the officially
  # supported version matrix - 16 is the floor (required by the
  # EXPLAIN GENERIC_PLAN-based plan-diff capture; see
  # docs/support-matrix.md#officially-supported-postgresql-versions), 17 and
  # 18 are the two newer officially supported majors. All three tags are
  # official, publicly pullable Docker Official Images
  # (https://hub.docker.com/_/postgres) - no registry credentials needed.
  # EDB Postgres Advanced Server / Extended Server are NOT covered here (see
  # the separate, secret-gated integration-edb-postgres job below); community
  # PostgreSQL is the only distribution with unconditional, every-PR coverage
  # - see docs/support-matrix.md#supported-distributions.
  integration-postgres:
    name: "Integration tests (real PostgreSQL): postgres:${{ matrix.postgres-version }}"
    runs-on: ubuntu-latest
    needs: build-and-test
    strategy:
      fail-fast: false
      matrix:
        postgres-version: [16, 17, 18]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Start PostgreSQL with pg_stat_statements preloaded
        # pg_stat_statements can only be activated via shared_preload_libraries
        # at server start (ALTER SYSTEM + reload is not enough for this
        # extension), so Postgres is started directly with `docker run`
        # rather than as a "services:" container, which offers no way to
        # override the entrypoint's command-line arguments.
        run: |
          docker run -d --name pgrr-test \
            -e POSTGRES_PASSWORD=test \
            -p 5432:5432 \
            postgres:${{ matrix.postgres-version }} \
            postgres -c shared_preload_libraries=pg_stat_statements

          echo "Waiting for PostgreSQL to accept connections..."
          for i in $(seq 1 30); do
            if docker exec pgrr-test pg_isready -U postgres >/dev/null 2>&1; then
              echo "PostgreSQL is ready."
              exit 0
            fi
            sleep 2
          done
          echo "PostgreSQL did not become ready in time." >&2
          docker logs pgrr-test || true
          exit 1

      - name: Run integration tests
        env:
          PGRR_TEST_DSN: postgres://postgres:test@localhost:5432/postgres?sslmode=disable
        # internal/e2e is the full pipeline (Collector -> correlation.Engine
        # -> alerting) against this same real Postgres — the closest thing
        # this suite has to proving the tool actually detects a regression,
        # as opposed to internal/storage and internal/collector's narrower
        # integration tests, which check one layer in isolation.
        # internal/cli's integration tests are narrower still — they only
        # prove `operator`/`collector --dry-run` actually succeeds against a
        # real, reachable Postgres (every unit test in that package uses a
        # deliberately unreachable DSN, so none of them can prove that).
        #
        # -p 1 forces `go test` to build/run these packages' test binaries
        # ONE AT A TIME instead of Go's default of running different
        # packages' tests concurrently (up to GOMAXPROCS processes at once).
        # internal/collector's and internal/e2e's integration tests both
        # call pg_stat_statements_reset() and read pg_stat_statements against
        # the SAME live Postgres container — that extension's state is
        # server-wide, not scoped per connection/session, so two of these
        # packages' test binaries running at the same time can (and, verified
        # locally, reliably do) stomp on each other: one test's reset() wipes
        # out call counts the other test is mid-way through accumulating,
        # corrupting both. -p 1 gives each package exclusive access to the
        # shared instance for the duration of its own tests.
        run: go test -tags=integration -race -count=1 -p 1 ./internal/storage/... ./internal/collector/... ./internal/e2e/... ./internal/cli/...

      - name: Stop PostgreSQL
        if: always()
        run: docker rm -f pgrr-test || true

  # ---------------------------------------------------------------------
  # EDB Postgres Advanced Server (EPAS) / EDB Postgres Extended Server (PGE)
  # ---------------------------------------------------------------------
  # Both are officially supported distributions (see
  # docs/support-matrix.md#supported-distributions), but their images are
  # NOT publicly pullable: they live behind the private, authenticated
  # docker.enterprisedb.com registry, which requires an EDB subscription
  # token (see
  # https://www.enterprisedb.com/docs/postgres_for_kubernetes/latest/private_edb_registries/).
  # GitHub Actions never exposes repository secrets to pull_request runs
  # triggered from a fork, so most external contributors' PRs have no way to
  # authenticate here regardless of repo configuration.
  #
  # To keep this coverage honest without ever breaking CI for a contributor
  # or maintainer who doesn't have an EDB subscription configured:
  #
  #   1. check-edb-subscription (below) resolves whether the
  #      EDB_SUBSCRIPTION_TOKEN repository secret is set, and exposes that as
  #      a job *output*. This indirection is required because GitHub Actions
  #      does not allow referencing the `secrets` context directly inside a
  #      job-level `if:` condition (only `github`, `needs`, `vars`, and
  #      `inputs` are permitted there - see
  #      https://docs.github.com/en/actions/reference/workflows-and-actions/contexts#context-availability
  #      and https://github.com/actions/runner/issues/520).
  #   2. integration-edb-postgres then gates its entire `if:` on that output,
  #      so the job is skipped outright (shows as "skipped" in the Actions
  #      UI, not "failed", and never blocks merging) whenever the secret
  #      isn't configured - which includes every fork PR, by design.
  #   3. Even when it does run, `continue-on-error: true` means a real test
  #      failure here - including one caused by this workflow's `docker run`
  #      invocation not exactly matching the real EDB images' entrypoint
  #      conventions, which this environment could not verify against the
  #      actual credential-gated images - can never turn an otherwise-green
  #      PR red.
  #
  # Maintainers with an EDB subscription: add EDB_SUBSCRIPTION_TOKEN under
  # this repository's Settings -> Secrets and variables -> Actions to enable
  # this job's coverage. See docs/support-matrix.md#ci-coverage-for-edb-distributions
  # for the full rationale and current status.
  check-edb-subscription:
    name: Check for EDB subscription token
    runs-on: ubuntu-latest
    outputs:
      has-token: ${{ steps.check.outputs.has-token }}

    steps:
      - name: Check whether EDB_SUBSCRIPTION_TOKEN is configured
        id: check
        env:
          EDB_SUBSCRIPTION_TOKEN: ${{ secrets.EDB_SUBSCRIPTION_TOKEN }}
        run: |
          if [ -n "$EDB_SUBSCRIPTION_TOKEN" ]; then
            echo "has-token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-token=false" >> "$GITHUB_OUTPUT"
          fi

  integration-edb-postgres:
    name: "Integration tests (EDB Postgres): ${{ matrix.display-name }}"
    runs-on: ubuntu-latest
    needs: [build-and-test, check-edb-subscription]
    if: needs.check-edb-subscription.outputs.has-token == 'true'
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - display-name: EDB Postgres Advanced Server (EPAS)
            image: docker.enterprisedb.com/k8s/edb-postgres-advanced:16-standard-ubi9
          - display-name: EDB Postgres Extended Server (PGE)
            image: docker.enterprisedb.com/k8s/edb-postgres-extended:16-standard-ubi9

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Log in to the EDB private registry
        run: |
          echo "${{ secrets.EDB_SUBSCRIPTION_TOKEN }}" | docker login docker.enterprisedb.com \
            --username k8s \
            --password-stdin

      - name: Start EDB Postgres with pg_stat_statements preloaded
        # Same shared_preload_libraries constraint as integration-postgres
        # above. The EPAS/PGE images are built as CloudNativePG operand
        # images first and foremost, so this repo cannot guarantee their
        # standalone `docker run` entrypoint behaves identically to the
        # community postgres image (e.g. POSTGRES_PASSWORD-driven init) -
        # this environment has no EDB subscription to verify it against the
        # real image. That uncertainty is exactly why this job carries
        # continue-on-error: true above.
        run: |
          docker run -d --name pgrr-test-edb \
            -e POSTGRES_PASSWORD=test \
            -p 5432:5432 \
            ${{ matrix.image }} \
            postgres -c shared_preload_libraries=pg_stat_statements

          echo "Waiting for EDB Postgres to accept connections..."
          for i in $(seq 1 30); do
            if docker exec pgrr-test-edb pg_isready -U postgres >/dev/null 2>&1; then
              echo "EDB Postgres is ready."
              exit 0
            fi
            sleep 2
          done
          echo "EDB Postgres did not become ready in time." >&2
          docker logs pgrr-test-edb || true
          exit 1

      - name: Run integration tests
        env:
          PGRR_TEST_DSN: postgres://postgres:test@localhost:5432/postgres?sslmode=disable
        run: go test -tags=integration -race -count=1 -p 1 ./internal/storage/... ./internal/collector/... ./internal/e2e/... ./internal/cli/...

      - name: Stop EDB Postgres
        if: always()
        run: docker rm -f pgrr-test-edb || true

  # Runs internal/controller's TestEnvtest_* suite against a real, locally
  # provisioned kube-apiserver + etcd (via controller-runtime's envtest),
  # instead of the fake client the default build-and-test job exercises. See
  # internal/controller/suite_test.go's doc comment for how to run it the
  # same way locally.
  envtest:
    name: Controller tests (real kube-apiserver)
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install setup-envtest
        run: go install sigs.k8s.io/controller-runtime/tools/setup-envtest@latest

      - name: Provision envtest binaries (etcd + kube-apiserver)
        # Version chosen to match the k8s.io/* dependency line in go.mod;
        # bump it alongside those dependencies if they're upgraded together.
        run: echo "KUBEBUILDER_ASSETS=$($(go env GOPATH)/bin/setup-envtest use 1.31.0 -p path)" >> "$GITHUB_ENV"

      - name: Run envtest-backed controller tests
        run: go test ./internal/controller/... -run TestEnvtest -v
