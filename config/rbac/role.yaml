---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
# Secrets in THIS (hub) cluster only. Covers both spec.dsnSecretRef (read
# directly) and spec.remoteClusterSecretRef (a kubeconfig Secret used to
# reach a DSN Secret in a different, remote/"spoke" cluster instead — see
# docs/multi-cluster.md). This rule grants no access whatsoever to any
# remote cluster: that access comes entirely from whatever RBAC is baked
# into the kubeconfig a remoteClusterSecretRef Secret points at, which is
# the responsibility of whoever creates that Secret, not this ClusterRole.
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - list
  - watch
# Read-only. Backs WorkloadWatchReconciler: watching Deployment/StatefulSet
# revision changes directly, so a DeploySource with sourceType "kubernetes"
# can feed this project without any GitOps tool (ArgoCD/Argo
# Rollouts/Flux) or webhook in front of the workload at all. Grants no
# write access to workloads — this feature only ever reads rollout status.
- apiGroups:
  - apps
  resources:
  - deployments
  - statefulsets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - radar.pgregressionradar.io
  resources:
  - deploysources
  - postgreswatches
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - radar.pgregressionradar.io
  resources:
  - deploysources/status
  - performanceregressions/status
  - postgreswatches/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - radar.pgregressionradar.io
  resources:
  - performanceregressions
  verbs:
  - create
  - get
  - list
  - patch
  - update
  - watch
