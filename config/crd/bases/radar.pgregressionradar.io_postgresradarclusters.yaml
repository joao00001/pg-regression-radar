---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: postgresradarclusters.radar.pgregressionradar.io
spec:
  group: radar.pgregressionradar.io
  names:
    kind: PostgresRadarCluster
    listKind: PostgresRadarClusterList
    plural: postgresradarclusters
    shortNames:
    - pgrc
    singular: postgresradarcluster
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.ready
      name: Ready
      type: boolean
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          PostgresRadarCluster represents a remote ("spoke") Kubernetes cluster
          registered by a cluster administrator. PostgresWatch resources reference
          these by name via spec.remoteClusterRef instead of pointing directly at
          arbitrary kubeconfig Secrets — administrators control which clusters are
          reachable, and watch creators can only choose from the pre-registered set.

          This is a cluster-scoped resource; only administrators should be allowed
          to create or modify it (see config/rbac).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              PostgresRadarClusterSpec describes a remote ("spoke") Kubernetes cluster
              whose kubeconfig is managed by a cluster administrator. Only
              administrators should be granted create/update/delete access to this
              resource — see config/rbac for the expected ClusterRole bindings.
            properties:
              kubeconfigSecretRef:
                description: |-
                  kubeconfigSecretRef points at a Secret, in the hub cluster, whose
                  named key holds the kubeconfig (raw YAML or JSON, identical to the
                  output of `kubectl config view --raw`) for this remote cluster.

                  The Secret must carry the consent label
                  pg-regression-radar.io/allow-postgreswatch-access=true so that the
                  manager can read it; the manager refuses to load kubeconfigs from
                  unlabelled Secrets. Only static credentials (bearer token, client
                  certificate) are allowed in the kubeconfig — exec-based plugins,
                  auth-providers, and proxy-url settings are rejected to prevent
                  execution of untrusted code in the manager pod.
                properties:
                  key:
                    description: key within the Secret's Data map that holds the kubeconfig
                      bytes.
                    minLength: 1
                    type: string
                  name:
                    description: name of the Secret.
                    minLength: 1
                    type: string
                  namespace:
                    description: namespace of the Secret in the hub cluster.
                    minLength: 1
                    type: string
                required:
                - key
                - name
                - namespace
                type: object
              namespace:
                description: |-
                  namespace is the default namespace on the remote cluster in which
                  dsnSecretRef objects are looked up. When a PostgresWatch sets
                  remoteClusterRef but does not set remoteNamespace, this field is
                  used. When both this field and remoteNamespace are empty, the
                  watch's own namespace (the hub namespace) is used — the convention
                  CloudNativePG follows for generated-credential Secrets.
                type: string
            required:
            - kubeconfigSecretRef
            type: object
          status:
            description: |-
              PostgresRadarClusterStatus reflects the observed state of the registered
              cluster, as last verified by the controller during reconciliation.
            properties:
              conditions:
                description: |-
                  conditions holds the detailed history of the periodic health check
                  PostgresRadarClusterReconciler runs against this cluster (a
                  lightweight discovery.ServerVersion() call — see
                  docs/multi-cluster.md#cluster-health-checks for exactly what is and
                  isn't verified). A type="Ready" condition is always present once the
                  cluster has been reconciled at least once; ready/message above are
                  kept in sync with it (status: "True" => ready=true) purely for
                  backward compatibility with anything that already reads those two
                  plain fields instead of walking conditions.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastProbeTime:
                description: |-
                  lastProbeTime is when the health check that produced the current
                  Ready condition last ran, regardless of outcome. Absent until the
                  first health check completes.
                format: date-time
                type: string
              message:
                description: |-
                  message carries a human-readable explanation, populated when ready
                  is false.
                type: string
              observedGeneration:
                description: observedGeneration is the .metadata.generation last reconciled.
                format: int64
                type: integer
              ready:
                description: |-
                  ready is true when the kubeconfig was last read and validated
                  successfully.
                type: boolean
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
